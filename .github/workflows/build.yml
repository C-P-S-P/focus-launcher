name: Build

# Every push to main and every pull request: unit tests, lint, and an optimized APK you can download
# from the run's page. No secrets are used, so this is safe to run for pull requests from forks.
#
# The APK built here is signed with a throwaway key that the runner generates. It is good for
# trying a change out. It is NOT the official download: it cannot be installed over the APK from
# the website or the release page, and they cannot be installed over it. Official APKs are built
# and signed on the owner's machine; the signing key is deliberately not on GitHub.

on:
  push:
    branches: [main]
    # Notes and the agent's brain change neither the APK nor the site.
    paths-ignore: ['.claude/**', '**.md']
  pull_request:
    paths-ignore: ['.claude/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # A newer push to a pull request replaces the older run. Runs on main are never cancelled:
  # each commit there (a release commit above all) keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test, lint, build the APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the build number in the version is the number of commits

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # gradle.properties pins the JDK path of the owner's machine. The runner's JDK is given on
      # the command line instead, which takes precedence, so no tracked file has to change.
      - name: Unit tests and lint
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:testDebugUnitTest :app:lintDebug

      - name: Build the optimized APK
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:assembleRelease

      - name: Name the APK and write the summary
        id: apk
        env:
          # For a pull request GITHUB_SHA is the temporary merge commit; name the APK after the real one.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          version=$("$aapt2" dump badging app/build/outputs/apk/release/app-release.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          name="focus-launcher-${version}-ci-${HEAD_SHA::7}.apk"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/${name}"
          (cd out && sha256sum "${name}" > "${name}.sha256")
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          {
            echo "### ${name}"
            echo ""
            echo "- version ${version}, commit \`${HEAD_SHA::7}\`, $(stat -c %s "out/${name}") bytes"
            echo "- sha256 \`$(cut -d' ' -f1 "out/${name}.sha256")\`"
            echo "- Signed with a throwaway CI key: for trying out only. It cannot update, or be updated by, the official APK from the website or the release page."
          } >> "$GITHUB_STEP_SUMMARY"

      # The Publish workflow builds the site with this same script on this same kind of machine.
      # Doing it here means a change that breaks it is caught in the pull request, not on release day.
      - name: The site builds around this APK
        env:
          APK_NAME: ${{ steps.apk.outputs.name }}
        run: |
          command -v rsvg-convert >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin; }
          FOCUS_APK="$GITHUB_WORKSPACE/out/$APK_NAME" site/build.sh   # absolute: build.sh changes directory
          test -s site/public/index.html && ! grep -q '{{' site/public/index.html
          ls -l site/public

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.apk.outputs.name }}
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: Keep the reports when something fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
